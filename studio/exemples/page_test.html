<!DOCTYPE html>
<!-- Page minimale qui respecte le contrat du studio : window.ready + window.frame(t).
     Sert uniquement a verifier que le rendu fonctionne (studio/verifier.sh). Ce n'est pas un style. -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0D2A44}
#c{position:absolute;width:30vw;height:30vw;border-radius:50%;background:#E7AC4D;top:35%}</style></head>
<body><div id="c"></div><script>
window.frame = t => { document.getElementById('c').style.left = (10 + 50 * Math.min(t, 1)) + 'vw'; };
window.ready = true;
</script></body></html>
